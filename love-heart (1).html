<title>Love Heart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-bleed black stage. Backdrop glow, blurred glow copy, sharp text canvas on top,
     a hint line and a replay control at the bottom. Single deliberate look (red on black). */
  :root {
    --bg: #050506;
    --ink: #ff2d3c;
    --flash: #ffd0da;
    --muted: #8a3a44;
    --font: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow: hidden;
  }
  .stage { position: relative; height: 100%; }
  .halo {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: radial-gradient(ellipse 46% 40% at 50% 46%, rgba(255,30,60,.34), rgba(120,0,20,.12) 55%, transparent 75%);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { filter: blur(9px) saturate(1.5); opacity: .95; pointer-events: none; }
  #c { touch-action: none; cursor: crosshair; }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .hint { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-align: center; }
  button {
    pointer-events: auto;
    background: transparent; color: var(--muted);
    border: 1px solid var(--muted); border-radius: 2px;
    font: 600 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 14px; cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--flash); outline-offset: 2px; }
</style>

<div class="stage">
  <div class="halo" id="halo"></div>
  <canvas id="glow" aria-hidden="true"></canvas>
  <canvas id="c" aria-label="A heart made of the words I love you. It beats, and the words move away from your cursor."></canvas>
  <div class="foot">
    <div class="hint">Move over the heart. Tap or click to burst.</div>
    <button id="replay" type="button">Replay</button>
  </div>
</div>

<script>
(function () {
  var PHRASE = "I love you";
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var glow = document.getElementById("glow"), gctx = glow.getContext("2d");
  var halo = document.getElementById("halo");
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var REVEAL_MS = 7000, FADE_MS = 900, BEAT_MS = 1150;
  var items = [], parts = [], W = 0, H = 0, S = 1, CX = 0, CY = 0, MX = 0, MY = 0; // MX/MY: heart centre
  var startT = 0, lastTwinkle = 0, lastSpawn = 0, lastTick = 0;
  var ptr = { x: -999, y: -999, on: false, lx: -999, ly: -999 };
  var shocks = [];                                  // click shockwaves: {x, y, t}
  var FAMILY = getComputedStyle(document.body).fontFamily;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- heart outline, tested as a polygon (unit: 1 = half the heart's width) ----
  var POLY = [];
  for (var k = 0; k < 360; k++) {
    var t0 = k / 360 * Math.PI * 2;
    POLY.push([Math.pow(Math.sin(t0), 3),
      (13 * Math.cos(t0) - 5 * Math.cos(2 * t0) - 2 * Math.cos(3 * t0) - Math.cos(4 * t0)) / 16]);
  }
  function inside(px, py) {
    var x = (px - CX) / S, y = (CY - py) / S, c = false;
    for (var i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
      var xi = POLY[i][0], yi = POLY[i][1], xj = POLY[j][0], yj = POLY[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }

  function layout() {
    var r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    glow.width = Math.round(W * dpr / 2); glow.height = Math.round(H * dpr / 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var availH = H - 76;
    S = Math.min(W * 0.46, availH / 1.85);
    CX = W / 2; CY = availH / 2 - S * 0.155;
    MX = CX; MY = CY - 0.05 * S;                    // visual centre of the heart

    var rand = rng(11), rowH = Math.max(12, S * 0.062);
    var top = CY - 0.76 * S, bottom = CY + 1.07 * S;
    items = [];
    ctx.textBaseline = "middle"; ctx.textAlign = "left";

    for (var yc = top + rowH / 2; yc < bottom; yc += rowH) {
      var hh = rowH * 0.46, segs = [], start = null;
      for (var x = CX - 1.05 * S; x <= CX + 1.05 * S; x += 1) {
        var ok = inside(x, yc - hh) && inside(x, yc + hh) && inside(x, yc);
        if (ok && start === null) start = x;
        if (!ok && start !== null) { segs.push([start, x]); start = null; }
      }
      segs.forEach(function (seg) {
        var x0 = seg[0] + 3, x1 = seg[1] - 3, cursor = x0, rowItems = [], guard = 0;
        while (cursor < x1 && guard++ < 40) {
          var fs = rowH * (0.62 + rand() * 0.34);
          ctx.font = "700 " + fs.toFixed(1) + "px " + FAMILY;
          var w = ctx.measureText(PHRASE).width;
          if (cursor + w > x1) {                    // try once more with a smaller size
            fs *= 0.72; ctx.font = "700 " + fs.toFixed(1) + "px " + FAMILY;
            w = ctx.measureText(PHRASE).width;
            if (cursor + w > x1) break;
          }
          rowItems.push({ x: cursor, y: yc, fs: fs, w: w, ox: 0, oy: 0, flash: null });
          cursor += w + fs * (0.8 + rand() * 0.7);
        }
        if (rowItems.length) {
          var last = rowItems[rowItems.length - 1], used = last.x + last.w - rowItems[0].x;
          var shift = ((x1 - x0) - used) / 2;
          rowItems.forEach(function (it) { it.x += shift; items.push(it); });
        }
      });
    }

    // reveal order: clockwise sweep from the top notch
    items.forEach(function (it) {
      var dx = it.x + it.w / 2 - MX, dy = it.y - MY;
      var a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
      it.key = a + (rand() - 0.5) * 0.45;
      it.d = Math.min(1.1, Math.sqrt(dx * dx + dy * dy) / S);       // distance from centre, in heart units
    });
    items.sort(function (p, q) { return p.key - q.key; });
    items.forEach(function (it, i) { it.t = (i / items.length) * REVEAL_MS; });
  }

  // ---- particles: small hearts and sparks ----
  function heartPath(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.35);
    c.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.4);
    c.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
    c.closePath();
  }
  function spawn(x, y, vx, vy, size, life, kind) {
    if (parts.length > 360) parts.shift();
    parts.push({ x: x, y: y, vx: vx, vy: vy, s: size, life: life, age: 0, kind: kind, spin: (Math.random() - .5) * 2 });
  }
  function ambient() {
    for (var tries = 0; tries < 12; tries++) {
      var x = CX + (Math.random() * 2 - 1) * S, y = CY + (Math.random() * 1.8 - 0.75) * S;
      if (inside(x, y)) {
        spawn(x, y, (Math.random() - .5) * 8, -(10 + Math.random() * 22), 1.2 + Math.random() * 2.2, 2200 + Math.random() * 1800, Math.random() < .35 ? "heart" : "spark");
        return;
      }
    }
  }
  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
      spawn(x, y, Math.cos(a) * v, Math.sin(a) * v - 30, 3 + Math.random() * 5, 1200 + Math.random() * 900, Math.random() < .65 ? "heart" : "spark");
    }
  }

  // ---- per-frame helpers ----
  function beatPhase(now) { return ((now - startT) % BEAT_MS) / BEAT_MS; }
  function pulse(ph) {
    return Math.exp(-Math.pow((ph - 0.05) / 0.05, 2)) + 0.62 * Math.exp(-Math.pow((ph - 0.25) / 0.05, 2));
  }
  function lerp(a, b, k) { return a + (b - a) * k; }

  function draw(now) {
    var dt = Math.min(48, now - (lastTick || now)); lastTick = now;
    var elapsed = now - startT, done = elapsed > REVEAL_MS + FADE_MS;
    var ph = beatPhase(now), p = reduced ? 0 : pulse(ph) * (Math.min(1, elapsed / 1500));
    var scale = 1 + 0.045 * p;
    var waveR = ph < 0.62 ? (ph / 0.62) * 1.25 * S : -1;
    var waveK = ph < 0.62 ? (1 - ph / 0.62) : 0;
    halo.style.opacity = (0.42 + 0.4 * p).toFixed(3);

    if (!reduced) {
      if (now - lastSpawn > 70) { lastSpawn = now; if (done || elapsed > 1500) ambient(); }
      if (done && now - lastTwinkle > 380) {
        lastTwinkle = now;
        var tw = items[Math.floor(Math.random() * items.length)]; if (tw) tw.flash = now;
      }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(MX, MY); ctx.scale(scale, scale); ctx.translate(-MX, -MY);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";

    var REPEL = Math.max(70, S * 0.3), lastFont = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i], age;
      if (reduced) age = FADE_MS;
      else {
        age = elapsed - it.t;
        if (age < 0) continue;
        if (it.flash !== null && now - it.flash < 1200) age = Math.min(age, now - it.flash);
      }
      var k = Math.min(1, age / FADE_MS);               // 0 fresh and bright, 1 settled

      // pointer repel (screen space) with a spring back
      var cxs = it.x + it.w / 2, cys = it.y, tx = 0, ty = 0;
      if (ptr.on && !reduced) {
        var sx = MX + (cxs - MX) * scale, sy = MY + (cys - MY) * scale;
        var ddx = sx - ptr.x, ddy = sy - ptr.y, dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < REPEL && dd > 0.01) { var f = Math.pow(1 - dd / REPEL, 2) * REPEL * 0.55; tx = ddx / dd * f; ty = ddy / dd * f; }
      }
      // click shockwaves push words outward as the ring passes
      for (var s = 0; s < shocks.length; s++) {
        var sh = shocks[s], rr = (now - sh.t) * 0.55, sdx = cxs - sh.x, sdy = cys - sh.y;
        var sd = Math.sqrt(sdx * sdx + sdy * sdy), band = Math.exp(-Math.pow((sd - rr) / 36, 2)) * Math.max(0, 1 - (now - sh.t) / 900);
        if (band > 0.01 && sd > 0.01) { tx += sdx / sd * band * 16; ty += sdy / sd * band * 16; }
      }
      it.ox += (tx - it.ox) * 0.16; it.oy += (ty - it.oy) * 0.16;

      // colour: deep red at the rim, warmer pink toward the centre, brightened by the beat ring and new words
      var base = 1 - Math.min(1, it.d);
      var r = 255, g = lerp(38, 92, base * 0.8), b = lerp(52, 110, base * 0.8);
      var boost = 0;
      if (waveR >= 0) boost = Math.exp(-Math.pow((it.d * S - waveR) / (0.16 * S), 2)) * waveK * 0.85;
      boost = Math.max(boost, 1 - k);
      g = lerp(g, 224, boost); b = lerp(b, 232, boost);

      var fnt = "700 " + it.fs.toFixed(1) + "px " + FAMILY;
      if (fnt !== lastFont) { ctx.font = fnt; lastFont = fnt; }
      ctx.fillStyle = "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
      ctx.fillText(PHRASE, it.x + it.ox, it.y + it.oy);
    }
    ctx.restore();

    // particles (screen space, drawn above the words)
    for (var q = parts.length - 1; q >= 0; q--) {
      var pt = parts[q]; pt.age += dt;
      if (pt.age >= pt.life) { parts.splice(q, 1); continue; }
      var u = pt.age / pt.life, a = Math.sin(Math.PI * Math.min(1, u * 1.15)) * (pt.kind === "heart" ? 0.95 : 0.8);
      pt.x += pt.vx * dt / 1000; pt.y += pt.vy * dt / 1000;
      pt.vx *= 0.995; pt.vy = pt.vy * 0.995 + (pt.kind === "heart" && pt.life < 2200 ? 26 : 0) * dt / 1000;
      ctx.globalAlpha = Math.max(0, a);
      if (pt.kind === "heart") { ctx.fillStyle = "#ff4a6a"; heartPath(ctx, pt.x, pt.y, pt.s * (1 - 0.3 * u)); ctx.fill(); }
      else { ctx.fillStyle = "#ffd9e0"; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.s * 0.6, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (var h = shocks.length - 1; h >= 0; h--) if (now - shocks[h].t > 900) shocks.splice(h, 1);

    // blurred copy of the whole frame gives the neon glow
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(canvas, 0, 0, glow.width, glow.height);

    if (!reduced) requestAnimationFrame(draw);
  }

  function play() {
    startT = performance.now(); parts.length = 0; shocks.length = 0;
    items.forEach(function (i) { i.flash = null; i.ox = i.oy = 0; });
    if (reduced) draw(startT);
  }

  function setPtr(e) {
    var r = canvas.getBoundingClientRect();
    ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.on = true;
    if (!reduced && Math.hypot(ptr.x - ptr.lx, ptr.y - ptr.ly) > 14) {
      ptr.lx = ptr.x; ptr.ly = ptr.y;
      spawn(ptr.x, ptr.y, (Math.random() - .5) * 30, -10 - Math.random() * 20, 1 + Math.random() * 1.6, 700 + Math.random() * 500, "spark");
    }
  }
  canvas.addEventListener("pointermove", setPtr);
  canvas.addEventListener("pointerdown", function (e) {
    setPtr(e);
    if (reduced) return;
    shocks.push({ x: ptr.x, y: ptr.y, t: performance.now() });
    burst(ptr.x, ptr.y, 22);
  });
  canvas.addEventListener("pointerleave", function () { ptr.on = false; });
  canvas.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") ptr.on = false; });

  window.addEventListener("resize", function () { layout(); if (reduced) draw(performance.now()); });
  document.getElementById("replay").addEventListener("click", play);

  layout(); startT = performance.now();
  if (reduced) draw(startT); else requestAnimationFrame(draw);
})();
</script>
