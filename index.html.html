<title>Love Heart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one full-bleed black canvas, heart centred, a single small replay control below it.
     Single deliberate look (red on black), so no light variant. */
  :root {
    --bg: #050506;
    --ink: #ff2d2d;
    --flash: #ffc9d6;
    --muted: #8a3a3a;
    --font: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Tamil", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans CJK JP", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow: hidden;
  }
  .stage { position: relative; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: transparent; color: var(--muted);
    border: 1px solid var(--muted); border-radius: 2px;
    font: 600 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 14px; cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--flash); outline-offset: 2px; }
</style>

<div class="stage">
  <canvas id="c" aria-label="A heart built from the words I love you in many languages"></canvas>
  <button id="replay" type="button">Replay</button>
</div>

<script>
(function () {
  var WORDS = [
    "I love you","Je t'aime","Te amo","Ti amo","Ich liebe dich","Jag älskar dig","Jeg elsker deg",
    "Ég elska þig","Rakastan sinua","Mina rakastan sinua","Kocham cię","Volim te","Ljubim te","Люблю тебе",
    "Я тебя люблю","Я тебе кохаю","Я цябе кахаю","Би чамд хайртай","Te iubesc","Te dua","Σ' αγαπώ",
    "Seni seviyorum","Men seni sevaman","Anh yêu em","Mahal kita","Mo nífẹ̀ rẹ","Ngiyakuthanda",
    "Nakupenda","Ek is lief vir jou","Waan ku jeclahay","T'estimo","Quérote","Ljubim te","Miluji tě",
    "Ma armastan sind","Mīlu tevi","Aš tave myliu","Szeretlek","Tá grá agam duit","Dw i'n dy garu di",
    "Maite zaitut","Volim te","Ta gra agam ort","Te quiero","Wo ai ni","我爱你","愛してる","사랑해",
    "நான் உன்னை காதலிக்கிறேன்","मैं तुमसे प्यार करता हूँ","मी तुझ्यावर प्रेम करतो","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ",
    "నేను నిన్ను ప్రేమిస్తున్నాను","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","আমি তোমাকে ভালোবাসি",
    "मी तुझ्यावर प्रेम करतो","أحبك","دوستت دارم","میں تم سے پیار کرتا ہوں","אני אוהב אותך",
    "მიყვარხარ","ฉันรักเธอ","ខ្ញុំស្រលាញ់អ្នក","Nakupenda","Huṛu m gị n'anya","Ik hou van je",
    "Eu te amo","Mahal kita","Aloha au iā ʻoe","Ya tyabe lyublyu","Ngiyakuthanda"
  ];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var REVEAL_MS = 9000, FADE_MS = 800;
  var items = [], startT = 0, lastTwinkle = 0, W = 0, H = 0, S = 1, CX = 0, CY = 0;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // heart outline (parametric curve), tested as a polygon; units: 1 = half the heart's width
  var POLY = [];
  for (var k = 0; k < 360; k++) {
    var t = k / 360 * Math.PI * 2;
    POLY.push([Math.pow(Math.sin(t), 3),
      (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]);
  }
  function inside(px, py) {
    var x = (px - CX) / S, y = (CY - py) / S, c = false;
    for (var i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
      var xi = POLY[i][0], yi = POLY[i][1], xj = POLY[j][0], yj = POLY[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }

  function layout() {
    var r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var availH = H - 56;                       // leave room for the button
    S = Math.min(W * 0.46, availH / 1.85);
    CX = W / 2; CY = availH / 2 - S * 0.155;   // heart spans y from -1.06 to 0.75 in curve units

    var rand = rng(7), rowH = Math.max(12, S * 0.058);
    var top = CY - 0.76 * S, bottom = CY + 1.07 * S;
    items = [];
    ctx.textBaseline = "middle"; ctx.textAlign = "left";

    for (var yc = top + rowH / 2, row = 0; yc < bottom; yc += rowH, row++) {
      var hh = rowH * 0.46, segs = [], start = null;
      for (var x = CX - 1.05 * S; x <= CX + 1.05 * S; x += 1) {
        var ok = inside(x, yc - hh) && inside(x, yc + hh) && inside(x, yc);
        if (ok && start === null) start = x;
        if (!ok && start !== null) { segs.push([start, x]); start = null; }
      }
      segs.forEach(function (seg) {
        var x0 = seg[0] + 3, x1 = seg[1] - 3, cursor = x0, guard = 0, rowItems = [];
        while (cursor < x1 && guard++ < 60) {
          var tries = 0, placed = false;
          while (tries++ < 7 && !placed) {
            var text = WORDS[Math.floor(rand() * WORDS.length)];
            var fs = rowH * (0.58 + rand() * 0.32);
            ctx.font = "700 " + fs.toFixed(1) + "px " + getComputedStyle(document.body).fontFamily;
            var w = ctx.measureText(text).width;
            if (cursor + w <= x1) {
              rowItems.push({ text: text, x: cursor, y: yc, fs: fs, w: w });
              cursor += w + fs * (0.55 + rand() * 0.45);
              placed = true;
            }
          }
          if (!placed) break;
        }
        if (rowItems.length) {                 // centre the row inside its segment
          var last = rowItems[rowItems.length - 1], used = last.x + last.w - rowItems[0].x;
          var shift = ((x1 - x0) - used) / 2;
          rowItems.forEach(function (it) { it.x += shift; items.push(it); });
        }
      });
    }

    // reveal order: sweep clockwise around the heart, starting at the top notch
    items.forEach(function (it) {
      var dx = it.x + it.w / 2 - CX, dy = it.y - (CY - 0.05 * S);
      var a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
      it.key = a + (rand() - 0.5) * 0.5;
    });
    items.sort(function (p, q) { return p.key - q.key; });
    items.forEach(function (it, i) { it.t = (i / items.length) * REVEAL_MS; it.flash = null; });
  }

  function mix(a, b, k) { return Math.round(a + (b - a) * k); }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var elapsed = now - startT, family = getComputedStyle(document.body).fontFamily;
    var done = elapsed > REVEAL_MS + FADE_MS;

    if (done && !reduced && now - lastTwinkle > 420) {
      lastTwinkle = now;
      var it0 = items[Math.floor(Math.random() * items.length)];
      if (it0) it0.flash = now;
    }

    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    for (var i = 0; i < items.length; i++) {
      var it = items[i], age;
      if (reduced) age = FADE_MS;
      else {
        age = elapsed - it.t;
        if (it.flash !== null && now - it.flash < FADE_MS * 1.4) age = now - it.flash;
        else if (age < 0) continue;
      }
      var k = Math.min(1, age / FADE_MS);                 // 0 = fresh white-pink, 1 = settled red
      var r = mix(255, 255, k), g = mix(201, 45, k), b = mix(214, 45, k);
      ctx.font = "700 " + it.fs.toFixed(1) + "px " + family;
      ctx.shadowColor = "rgba(255,40,40," + (0.55 * (1 - k)).toFixed(2) + ")";
      ctx.shadowBlur = k < 1 ? 10 : 0;
      ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.fillText(it.text, it.x, it.y);
    }
    ctx.shadowBlur = 0;
    if (!reduced) requestAnimationFrame(draw);
  }

  function play() { startT = performance.now(); items.forEach(function (i) { i.flash = null; }); if (reduced) draw(startT); }

  window.addEventListener("resize", function () { layout(); if (reduced) draw(performance.now()); });
  document.getElementById("replay").addEventListener("click", play);

  layout(); startT = performance.now();
  if (reduced) draw(startT); else requestAnimationFrame(draw);
})();
</script>
